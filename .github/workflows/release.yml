name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  desktop:
    name: Build ${{ matrix.platform }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: Windows, runner: windows-latest, arch: x64, flag: win }
          - { platform: macOS, runner: macos-15, arch: arm64, flag: mac }
          - { platform: macOS, runner: macos-15-intel, arch: x64, flag: mac }
          - { platform: Linux, runner: ubuntu-24.04, arch: x64, flag: linux }
          - { platform: Linux, runner: ubuntu-24.04-arm, arch: arm64, flag: linux }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Check release identity
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: node scripts/release-assets.mjs check-version
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm libarchive-tools libfuse2t64 libnss3 libatk-bridge2.0-0 libgtk-3-0 libasound2t64 xvfb
      - run: npm ci --no-audit --no-fund
      - run: npm run verify
      - run: npm run smoke:package
      - name: Build native packages
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run desktop:dist -- --${{ matrix.flag }} --${{ matrix.arch }}
      - name: Smoke test packaged desktop
        if: runner.os != 'Linux'
        run: node scripts/smoke-desktop-launch.mjs
      - name: Smoke test packaged desktop (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/smoke-desktop-launch.mjs
      - name: Collect distributable files
        run: node scripts/release-assets.mjs collect
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release and source archive
    needs: desktop
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release-assets
      - name: Create source ZIP and checksums
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: node scripts/release-assets.mjs finalize
      - name: Publish verified artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "AgentHist $RELEASE_TAG · CLI + Desktop" --notes-file docs/releases/0.3.0.md
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
